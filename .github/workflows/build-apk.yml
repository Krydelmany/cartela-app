name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          flutter create --platforms=android --org br.com.giovani --project-name cartela_app .
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib && mv lib_bak lib
          rm -f test/widget_test.dart

      - name: Get dependencies & Run tests
        run: |
          flutter pub get
          flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Cartela App - APK Atualizado"
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
